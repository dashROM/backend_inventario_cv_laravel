<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Usuarios</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <div class="container mx-auto p-6">

        <h1 class="text-3xl font-bold mb-6 text-center">
            CRUD Usuarios Laravel API
        </h1>

        <!-- Formulario -->
        <div class="bg-white p-6 rounded shadow mb-6">

            <input type="hidden" id="userId">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                <input
                    type="text"
                    id="name"
                    placeholder="Nombre"
                    class="border p-2 rounded w-full"
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Correo"
                    class="border p-2 rounded w-full"
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    class="border p-2 rounded w-full"
                >

            </div>

            <div class="mt-4 flex gap-2">

                <button
                    onclick="guardarUsuario()"
                    class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
                >
                    Guardar
                </button>

                <button
                    onclick="limpiarFormulario()"
                    class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600"
                >
                    Limpiar
                </button>

            </div>

        </div>

        <!-- Tabla -->
        <div class="bg-white p-6 rounded shadow">

            <table class="w-full border-collapse">

                <thead>
                    <tr class="bg-gray-200">
                        <th class="border p-2">ID</th>
                        <th class="border p-2">Nombre</th>
                        <th class="border p-2">Email</th>
                        <th class="border p-2">Acciones</th>
                    </tr>
                </thead>

                <tbody id="tablaUsuarios">
                </tbody>

            </table>

        </div>

    </div>

<script>

const API_URL = "http://127.0.0.1:8000/api/usuario";

const TOKEN = "7|iqIVoLv10mhT1sbIWxpIDzGcE2yiNSEorBoqHG7fe862f5e6";

const headers = {
    "Authorization": `Bearer ${TOKEN}`,
    "Accept": "application/json",
    "Content-Type": "application/json"
};

document.addEventListener("DOMContentLoaded", () => {
    listarUsuarios();
});

async function listarUsuarios() {

    try {

        const response = await fetch(API_URL, {
            method: "GET",
            headers
        });

        const usuarios = await response.json();

        let html = "";

        usuarios.forEach(usuario => {

            html += `
                <tr>
                    <td class="border p-2">${usuario.id}</td>
                    <td class="border p-2">${usuario.name}</td>
                    <td class="border p-2">${usuario.email}</td>
                    <td class="border p-2">

                        <button
                            onclick="editarUsuario(${usuario.id})"
                            class="bg-yellow-500 text-white px-3 py-1 rounded"
                        >
                            Editar
                        </button>

                        <button
                            onclick="eliminarUsuario(${usuario.id})"
                            class="bg-red-600 text-white px-3 py-1 rounded ml-2"
                        >
                            Eliminar
                        </button>

                    </td>
                </tr>
            `;
        });

        document.getElementById("tablaUsuarios").innerHTML = html;

    } catch (error) {
        console.error(error);
        alert("Error al listar usuarios");
    }
}

async function guardarUsuario() {

    const id = document.getElementById("userId").value;

    const datos = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
    };

    try {

        let response;

        if (id === "") {

            response = await fetch(API_URL, {
                method: "POST",
                headers,
                body: JSON.stringify(datos)
            });

        } else {

            response = await fetch(`${API_URL}/${id}`, {
                method: "PUT",
                headers,
                body: JSON.stringify(datos)
            });

        }

        if (!response.ok) {
            throw new Error("Error en la petición");
        }

        limpiarFormulario();
        listarUsuarios();

    } catch (error) {
        console.error(error);
        alert("Error al guardar");
    }
}

async function editarUsuario(id) {

    try {

        const response = await fetch(`${API_URL}/${id}`, {
            method: "GET",
            headers
        });

        const usuario = await response.json();

        document.getElementById("userId").value = usuario.id;
        document.getElementById("name").value = usuario.name;
        document.getElementById("email").value = usuario.email;

    } catch (error) {
        console.error(error);
        alert("Error al obtener usuario");
    }
}

async function eliminarUsuario(id) {

    if (!confirm("¿Desea eliminar este usuario?")) {
        return;
    }

    try {

        const response = await fetch(`${API_URL}/${id}`, {
            method: "DELETE",
            headers
        });

        if (!response.ok) {
            throw new Error("Error al eliminar");
        }

        listarUsuarios();

    } catch (error) {
        console.error(error);
        alert("Error al eliminar");
    }
}

function limpiarFormulario() {

    document.getElementById("userId").value = "";
    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("password").value = "";
}

</script>

</body>
</html>
